name: Deploy bundle (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || secrets.HOST_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN || secrets.HOST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Databricks credentials
        run: |
          if [ -z "${DATABRICKS_HOST}" ] || [ -z "${DATABRICKS_TOKEN}" ]; then
            echo "Missing DATABRICKS_HOST and/or DATABRICKS_TOKEN for environment prod."
            echo "Set either DATABRICKS_HOST/DATABRICKS_TOKEN or HOST_SECRET/HOST_TOKEN in GitHub: Settings > Environments > prod > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle (prod)
        run: databricks bundle deploy -t prod
